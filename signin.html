<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💔 Ninna Nenedare – A Heart That Echoes</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #fff0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #1a1a2e;
    }

    .back-button, .back-button1 {
      position: absolute;
      top: 50px;
      z-index: 10;
    }

    .back-button1 {
      left: 40px;
    }

    .back-button {
      left: 80px;
    }

    .back-button img, .back-button1 img {
      width: 40px;
      height: 40px;
      transition: transform 0.3s ease;
    }

    .back-button img:hover, .back-button1 img:hover {
      transform: scale(1.1);
    }

    h1 {
      margin-top: 30px;
      font-size: 2.5em;
      color: #feb631;
      text-shadow: 0 0 10px #feb631;
      text-align: center;
    }

    .player-container {
      margin: 20px auto;
      width: 90%;
      max-width: 700px;
      height: 380px;
      position: relative;
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 15px;
      box-shadow: 0 0 20px #feb631;
    }

    .playlist-tabs {
      margin: 20px auto 10px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 1;
      max-width: 90%;
    }

    .tab-btn {
      background: #feb631;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: #460606;
      transform: translateY(-2px);
      box-shadow: 0 0 15px #ff9999;
    }

    .tab-btn:hover {
      transform: translateY(-2px);
      background: #db990b;
    }

    .playlist-info {
      margin: 10px auto 20px;
      max-width: 700px;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
    }

    .floating-notes {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .float-emoji {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: float-up 8s linear forwards;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes float-up {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.2);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
      }

      .tab-btn {
        padding: 8px 15px;
        font-size: 0.9em;
      }

      .player-container {
        height: 300px;
      }

      .back-button, .back-button1 {
        top: 15px;
        left: 15px;
      }

      .back-button img, .back-button1 img {
        width: 35px;
        height: 35px;
      }
    }
  </style>
</head>
<body>
  <div class="back-button1">
    <a href="home.html"><img src="home.png" alt="Home"></a>
  </div>

  <div class="back-button">
    <a href="Sogam home.html"><img src="back arrow.png" alt="Back"></a>
  </div>

  <h1>💔 Ninna Nenedare – A Heart That Echoes</h1>

  <div class="playlist-tabs">
    <button class="tab-btn" onclick="loadPlaylist('playlist1', event)">💔 Ninna Nenedare</button>
    <button class="tab-btn" onclick="loadPlaylist('playlist2', event)">😢 Ellide Ninna Hesaru</button>
    <button class="tab-btn" onclick="loadPlaylist('playlist3', event)">😭 Kanasalli Ninna</button>
  </div>

  <div class="playlist-info" id="playlist-description">
    <h3>💔 Ninna Nenedare</h3>
    <p>When memories hurt softly—these melodies carry the echoes of your absence.</p>
  </div>

  <div class="player-container">
    <iframe id="spotify-player"
      src="https://open.spotify.com/embed/playlist/37i9dQZF1DX74BzJSsfdGA"
      allowtransparency="true"
      allow="encrypted-media">
    </iframe>
  </div>

  <div class="floating-notes" id="float-container"></div>

  <script>
    const playlists = {
      playlist1: {
        id: "37i9dQZF1DX74BzJSsfdGA",
        title: "💔 Ninna Nenedare",
        description: "When memories hurt softly—these melodies carry the echoes of your absence."
      },
      playlist2: {
        id: "6vO2xd2Ks0bwsydkYkLLqD?si=MEKEsT7WT8WPZeum0TsZsQ",
        title: "😢 Ellide Ninna Hesaru",
        description: "Searching for your name in the silence of every verse."
      },
      playlist3: {
        id: "2mUU9L3apvuJWy6HggtJXI?si=W1inILTzSbS-M6OQf9xH4A",
        title: "😭 Kanasalli Ninna",
        description: "A dream of you, fading like mist in the morning."
      }
    };

    function loadPlaylist(type, event) {
      const playlist = playlists[type];
      const player = document.getElementById("spotify-player");
      const desc = document.getElementById("playlist-description");

      player.src = `https://open.spotify.com/embed/playlist/${playlist.id}`;
      desc.innerHTML = `<h3>${playlist.title}</h3><p>${playlist.description}</p>`;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    // Set default playlist
    window.addEventListener('DOMContentLoaded', () => {
      loadPlaylist('playlist1', { target: document.querySelector('.tab-btn') });
    });

    // Floating emojis
    const emojis = ['😫', '🎶', '😭', '😔'];
    const floatContainer = document.getElementById("float-container");

    function createFloatingEmoji() {
      const emoji = document.createElement("div");
      emoji.className = "float-emoji";
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * 100 + "vw";
      emoji.style.animationDuration = 4 + Math.random() * 4 + "s";
      floatContainer.appendChild(emoji);
      setTimeout(() => emoji.remove(), 8000);
    }

    setInterval(createFloatingEmoji, 500);
  </script>
</body>
</html>
