<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malayalam Vibes</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #1a1a2e;
      color: #fff8e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .back-button {
      position: absolute;
      top: 50px;
      left: 80px;
      z-index: 10;
    }
    
    .back-button img {
      width: 40px;
      height: 40px;
      transition: transform 0.3s ease;
    }
    
    .back-button img:hover {
      transform: scale(1.1);
    }
    h1 {
      margin-top: 30px;
      font-size: 2.5em;
      color: #ffeb3b;
      text-shadow: 0 0 10px rgba(255, 235, 59, 0.8);
    }

    .playlist-tabs {
      margin: 20px auto 10px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90%;
    }

    .tab-btn {
      background: #ffeb3b;
      color: #1a1a2e;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: #b8a501;
      transform: translateY(-2px);
      box-shadow: 0 0 15px #ffeb3b;
    }

    .tab-btn:hover {
      background: #f7ec71;
    }

    .playlist-info {
      margin: 10px auto;
      max-width: 700px;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
    }

    .player-container {
      margin: 20px auto;
      width: 90%;
      max-width: 700px;
      height: 380px;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 15px;
      box-shadow: 0 0 20px #ffeb3b;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
      }

      .tab-btn {
        padding: 8px 15px;
        font-size: 0.9em;
      }

      .player-container {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="back-button">
     <a href="Home.html"><img src="back arrow.jfif" alt="Back to Home"></a>
   </div>
<h1>🎶 Mallu 90s Paattu Vibes – Chenda Melam Mode On!</h1>

  <div class="playlist-tabs">
    
    <button class="tab-btn" onclick="loadPlaylist('party')">Party Mix</button>
    
  </div>

  <div class="playlist-info" id="playlist-description">
<h3>🥁 Thaalam Kettu, Paattu Thudikkum!</h3>
    <p>Punchy Malayalam tracks to boost your energy</p>
  </div>

  <div class="player-container">
    <iframe id="spotify-player"
            src="https://open.spotify.com/embed/playlist/37i9dQZF1DX0L49JehX6ZU"
            frameborder="0"
            allowtransparency="true"
            allow="encrypted-media">
    </iframe>
  </div>

  <script>
    const playlists = {
      
     
      party: {
        id: "37i9dQZF1DX7ko3EzbLi5w?si=hGrASW7QTQSWjSCuBngshQ",
        title: "🎉 Malayalam Party Hits",
        description: "Latest Malayalam party bangers"
      },
      
     
    };

    function loadPlaylist(type) {
      const playlist = playlists[type];
      const player = document.getElementById("spotify-player");
      const desc = document.getElementById("playlist-description");

      player.src = `https://open.spotify.com/embed/playlist/${playlist.id}`;
      desc.innerHTML = `<h3>${playlist.title}</h3><p>${playlist.description}</p>`;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadPlaylist('mass');
    });
  </script>

</body>
</html>
