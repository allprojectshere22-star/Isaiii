<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malayalam Love Songs</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #fff0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #1a1a2e;
    }

    .back-button, .back-button1 {
      position: absolute;
      top: 50px;
      z-index: 10;
    }

    .back-button1 {
      left: 40px;
    }

    .back-button {
      left: 80px;
    }

    .back-button img, .back-button1 img {
      width: 40px;
      height: 40px;
      transition: transform 0.3s ease;
    }

    .back-button img:hover, .back-button1 img:hover {
      transform: scale(1.1);
    }

    h1 {
      margin-top: 30px;
      font-size: 2.5em;
      color: #ff5b5b;
      text-shadow: 0 0 10px rgba(255, 75, 75, 0.7);
      text-align: center;
    }

    .player-container {
      margin: 20px auto;
      width: 90%;
      max-width: 700px;
      height: 380px;
      position: relative;
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 15px;
      box-shadow: 0 0 20px #ff7a7a;
    }

    .playlist-tabs {
      margin: 20px auto 10px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 1;
      max-width: 90%;
    }

    .tab-btn {
      background: #ff5b5b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: #460606;
      transform: translateY(-2px);
      box-shadow: 0 0 15px #ff9999;
    }

    .tab-btn:hover {
      transform: translateY(-2px);
      background: #ff7676;
    }

    .playlist-info {
      margin: 10px auto 20px;
      max-width: 700px;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
    }

    
    .floating-notes {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .float-emoji {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: float-up 8s linear forwards;
      z-index: 0;
      pointer-events: none;
      color: #ff7a7a;
    }

    @keyframes float-up {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.2);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
      }

      .tab-btn {
        padding: 8px 15px;
        font-size: 0.9em;
      }

      .player-container {
        height: 300px;
      }

      .back-button, .back-button1 {
        top: 15px;
      }

      .back-button img, .back-button1 img {
        width: 35px;
        height: 35px;
      }
    }
  </style>
</head>
<body>

  <div class="back-button1">
    <a href="home.html"><img src="home.png" alt="Back to Home"></a>
  </div>

  <div class="back-button">
    <a href="kaadhal home.html"><img src="back arrow.png" alt="Back to Kaadhal"></a>
  </div>


  <h1>💓 Love Notes – Feel Every Beat</h1>


  <div class="playlist-tabs">
    <button class="tab-btn" onclick="loadPlaylist('premam')">💖 Premam Songs</button>
    <button class="tab-btn" onclick="loadPlaylist('heartbreak')">💔 Heartbreak Melodies</button>
    <button class="tab-btn" onclick="loadPlaylist('romance2000s')">🎶  All time Romance</button>
    <button class="tab-btn" onclick="loadPlaylist('evergreen')">🌿 Evergreen Romance</button>
  </div>


  <div class="playlist-info" id="playlist-description">
    <h3>💘 Your Heart’s Playlist</h3>
    <p>Press play and fall in love again—with every lyric, every melody, every moment.</p>
  </div>


  <div class="player-container">
    <iframe id="spotify-player"
      src="https://open.spotify.com/embed/playlist/37i9dQZF1DX3lmpQSniUBH?si=vz8GGiYVT3ivVDuhOpDj4w"
      frameborder="0"
      allowtransparency="true"
      allow="encrypted-media">
    </iframe>
  </div>

 
  <div class="floating-notes" id="float-container"></div>


  <script>
    const playlists = {
      premam: {
        id: "37i9dQZF1DX3lmpQSniUBH?si=vz8GGiYVT3ivVDuhOpDj4w",
        title: "💖 Premam Songs",
        description: "Youthful, passionate Malayalam love tracks that make your heart skip a beat."
      },
      heartbreak: {
        id: "4t2gX3OWkkdy8vHiVrRXq7?si=OsnjxnQ9TjmxEow7mx1b4A",
        title: "💔 Heartbreak Melodies",
        description: "Emotional love songs to soothe your heart in times of longing and loss."
      },
      romance2000s: {
        id: "37i9dQZF1DXdgT9BVfflhb?si=SDbWIRIkQa684GDbL5OiPQ",
        title: "🎶 all time Romance",
        description: "Relive the golden era of 2000s with these nostalgic romantic gems."
      },
      evergreen: {
        id: "1NTgqLmK7epPufSu7Qidvh?si=TMLkOThHS4Oei1taPKZeKA",
        title: "🌿 Evergreen Romance",
        description: "Timeless Malayalam love songs that will forever remain in your heart."
      }
    };

    function loadPlaylist(type) {
      const playlist = playlists[type];
      const player = document.getElementById("spotify-player");
      const desc = document.getElementById("playlist-description");

      player.src = `https://open.spotify.com/embed/playlist/${playlist.id}`;
      desc.innerHTML = `<h3>${playlist.title}</h3><p>${playlist.description}</p>`;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadPlaylist('premam'); // default
    });

    const emojis = ['😍', '🎶', '💕', '😘'];
    const floatContainer = document.getElementById("float-container");

    function createFloatingEmoji() {
      const emoji = document.createElement("div");
      emoji.className = "float-emoji";
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * 100 + "vw";
      emoji.style.animationDuration = 4 + Math.random() * 4 + "s";
      floatContainer.appendChild(emoji);
      setTimeout(() => emoji.remove(), 8000);
    }

    setInterval(createFloatingEmoji, 500);
      event.target.classList.add('active');
    window.addEventListener('DOMContentLoaded', () => {
      loadPlaylist('romantic');
    });
  </script>
</body>
</html>
