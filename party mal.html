<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Songs</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #fbeaff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #11111f;
    }
    .back-button {
      position: absolute;
      top: 50px;
      left: 80px;
      z-index: 10;
    }
    
    .back-button img {
      width: 40px;
      height: 40px;
      transition: transform 0.3s ease;
    }
    
    .back-button img:hover {
      transform: scale(1.1);
    }
    h1 {
      margin-top: 30px;
      font-size: 2.5em;
      color: #56b6ff;
      text-shadow: 0 0 10px rgba(86, 182, 255, 0.7);
    }

    .player-container {
      margin: 20px auto;
      width: 90%;
      max-width: 700px;
      height: 380px;
      position: relative;
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 15px;
      box-shadow: 0 0 20px #6ecbff;
    }

    .playlist-tabs {
      margin: 20px auto 10px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 1;
      max-width: 90%;
    }

    .tab-btn {
      background: #56b6ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: #04293a;
      transform: translateY(-2px);
      box-shadow: 0 0 15px #6ecbff;
    }

    .tab-btn:hover {
      transform: translateY(-2px);
      background: #74d3ff;
    }

    .playlist-info {
      margin: 10px auto 20px;
      max-width: 700px;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
      }

      .tab-btn {
        padding: 8px 15px;
        font-size: 0.9em;
      }

      .player-container {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="back-button">
     <a href="Home.html"><img src="back arrow.jfif" alt="Back to Home"></a>
   </div>
  <h1>🎵 English Vibes - Spotify Edition</h1>

  <!-- Playlist Tabs -->
  <div class="playlist-tabs">    
    <button class="tab-btn" onclick="loadPlaylist('party')">🎉 Party Vibes</button>
  </div>

  <!-- Playlist Info -->
  <div class="playlist-info" id="playlist-description">
    <h3>🌟 Top Pop Hits</h3>
    <p>Today's trending pop songs from global charts</p>
  </div>

  <div class="player-container">
    <iframe id="spotify-player"
            src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M"
            frameborder="0"
            allowtransparency="true"
            allow="encrypted-media">
    </iframe>
  </div>

  <script>
    const playlists = {
     
      party: {
        id: "37i9dQZF1DXaXB8fQg7xif",
        title: "🎉 Party Vibes",
        description: "Ultimate English party anthems to get lit"
      },
      
    };

    function loadPlaylist(type) {
      const playlist = playlists[type];
      const player = document.getElementById("spotify-player");
      const desc = document.getElementById("playlist-description");

      player.src = `https://open.spotify.com/embed/playlist/${playlist.id}`;
      desc.innerHTML = `<h3>${playlist.title}</h3><p>${playlist.description}</p>`;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadPlaylist('pop');
    });
  </script>

</body>
</html>
