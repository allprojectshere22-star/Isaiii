<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Sad Songs</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #fff0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #1a1a2e;
    }

    .back-button, .back-button1 {
      position: absolute;
      top: 50px;
      z-index: 10;
    }

    .back-button { left: 80px; }
    .back-button1 { left: 40px; }

    .back-button img, .back-button1 img {
      width: 40px;
      height: 40px;
      transition: transform 0.3s ease;
    }

    .back-button img:hover,
    .back-button1 img:hover {
      transform: scale(1.1);
    }

    h1 {
      margin-top: 30px;
      font-size: 2.5em;
      color: #feb631;
      text-shadow: 0 0 10px #feb631;
    }

    .player-container {
      margin: 20px auto;
      width: 90%;
      max-width: 700px;
      height: 380px;
      position: relative;
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 15px;
      box-shadow: 0 0 20px #feb631;
    }

    .playlist-tabs {
      margin: 20px auto 10px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 1;
      max-width: 90%;
    }

    .tab-btn {
      background: #feb631;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: #460606;
      transform: translateY(-2px);
      box-shadow: 0 0 15px #ff9999;
    }

    .tab-btn:hover {
      transform: translateY(-2px);
      background: #db990b;
    }

    .playlist-info {
      margin: 10px auto 20px;
      max-width: 700px;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
    }

    .floating-notes {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .float-emoji {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: float-up 8s linear forwards;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes float-up {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.2);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
      }

      .tab-btn {
        padding: 8px 15px;
        font-size: 0.9em;
      }

      .player-container {
        height: 300px;
      }

      .back-button,
      .back-button1 {
        top: 15px;
        left: 15px;
      }

      .back-button img,
      .back-button1 img {
        width: 35px;
        height: 35px;
      }
    }
  </style>
</head>
<body>
  <div class="back-button1">
    <a href="home.html"><img src="home.png" alt="Home"></a>
  </div>

  <div class="back-button">
    <a href="Sogam home.html"><img src="back arrow.png" alt="Back"></a>
  </div>

  <h1>💔 English Sad Songs – Echoes of the Heart</h1>

  <div class="playlist-tabs">
    <button class="tab-btn active" onclick="loadPlaylist('sad')">😔 Sad & Chill</button>
    <button class="tab-btn" onclick="loadPlaylist('heartbreak')">💔 Heartbreak Ballads</button>
    <button class="tab-btn" onclick="loadPlaylist('alone')">🌧 Alone Time</button>
    <button class="tab-btn" onclick="loadPlaylist('lateNight')">🌙 Late Night Tears</button>
  </div>

  <div class="playlist-info" id="playlist-description">
    <h3>😔 Sad & Chill</h3>
    <p>Mellow English tracks for a quiet, emotional moment.</p>
  </div>

  <div class="player-container">
    <iframe id="spotify-player"
      src="https://open.spotify.com/embed/playlist/37i9dQZF1DX7qK8ma5wgG1"
      allowtransparency="true"
      allow="encrypted-media">
    </iframe>
  </div>

  <div class="floating-notes" id="float-container"></div>

  <script>
    const playlists = {
      sad: {
        id: "37i9dQZF1DX7qK8ma5wgG1",
        title: "😔 Sad & Chill",
        description: "Mellow English tracks for a quiet, emotional moment."
      },
      heartbreak: {
        id: "37i9dQZF1DWZUAeYvs88zc",
        title: "💔 Heartbreak Ballads",
        description: "Heart-wrenching songs that echo every breakup you've ever felt."
      },
      alone: {
        id: "37i9dQZF1DX7gIoKXt0gmx",
        title: "🌧 Alone Time",
        description: "Perfect companion for your lonely evenings."
      },
      lateNight: {
        id: "25ZzkJkOuYir9kHr2CqwPQ?si=T921gqjcQ12YfoTLE7Mahw",
        title: "🌙 Late Night Tears",
        description: "Let it all out with these late-night sob sessions."
      }
    };

    function loadPlaylist(type) {
      const playlist = playlists[type];
      const player = document.getElementById("spotify-player");
      const desc = document.getElementById("playlist-description");

      player.src = `https://open.spotify.com/embed/playlist/${playlist.id}`;
      desc.innerHTML = `<h3>${playlist.title}</h3><p>${playlist.description}</p>`;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    const emojis = ['😫', '🎶', '😭', '😔'];
    const floatContainer = document.getElementById("float-container");

    function createFloatingEmoji() {
      const emoji = document.createElement("div");
      emoji.className = "float-emoji";
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * 100 + "vw";
      emoji.style.animationDuration = 4 + Math.random() * 4 + "s";
      floatContainer.appendChild(emoji);
      setTimeout(() => emoji.remove(), 8000);
    }

    setInterval(createFloatingEmoji, 500);

    window.addEventListener('DOMContentLoaded', () => {
      loadPlaylist('sad');
    });
  </script>
</body>
</html>
