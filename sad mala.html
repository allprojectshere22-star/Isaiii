<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prema Sanchari – Kannada Love Vibes</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #fff0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #1a1a2e;
    }
    .back-button, .back-button1 {
      position: absolute;
      top: 50px;
      z-index: 10;
    }
    .back-button {
      left: 80px;
    }
    .back-button1 {
      left: 40px;
    }
    .back-button img, .back-button1 img {
      width: 40px;
      height: 40px;
      transition: transform 0.3s ease;
    }
    .back-button img:hover, .back-button1 img:hover {
      transform: scale(1.1);
    }
    h1 {
      margin-top: 30px;
      font-size: 2.5em;
      color: #ff5b5b;
      text-shadow: 0 0 10px rgba(255,75,75,0.7);
    }
    .playlist-tabs {
      margin: 20px auto 10px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90%;
    }
    .tab-btn {
      background: #ff5b5b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      background: #460606;
      transform: translateY(-2px);
      box-shadow: 0 0 15px #ff9999;
    }
    .tab-btn:hover {
      transform: translateY(-2px);
      background: #ff7676;
    }
    .playlist-info {
      margin: 10px auto 20px;
      max-width: 700px;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
    }
    .player-container {
      margin: 20px auto;
      width: 90%;
      max-width: 700px;
      height: 380px;
      position: relative;
      z-index: 1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 15px;
      box-shadow: 0 0 20px #ff7a7a;
    }
    .floating-notes {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .float-emoji {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: float-up 8s linear forwards;
      z-index: 0;
      pointer-events: none;
      color: #ff7a7a;
    }

    @keyframes float-up {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.2);
        opacity: 0;
      }
    }
     
    @media (max-width: 600px) {
      h1 { font-size: 1.8em; }
      .tab-btn { padding: 8px 15px; font-size: 0.9em; }
      .player-container { height: 300px; }
      .back-button, .back-button1 {
        top: 15px;
      }
      .back-button img, .back-button1 img {
        width: 35px;
        height: 35px;
      }
    }
  </style>
</head>
<body>
  <div class="back-button1">
    <a href="home.html"><img src="home.png" alt="Back to Home"></a>
  </div>
  <div class="back-button">
    <a href="kaadhal home.html"><img src="back arrow.png" alt="Back"></a>
  </div>
  <h1>💞 Prema Sanchari – Journey of Love</h1>
  <div class="playlist-tabs">
    <button class="tab-btn" onclick="loadPlaylist('romantic1')">💖 Romantic Mix</button>
    <button class="tab-btn" onclick="loadPlaylist('romantic2')">🌹 Love Ballads</button>
    <button class="tab-btn" onclick="loadPlaylist('romantic3')">💕 Heartfelt Duets</button>
    <button class="tab-btn" onclick="loadPlaylist('romantic4')">❤️ Melodic Romance</button>
  </div>
  <div class="playlist-info" id="playlist-description">
    <h3>💖 Romantic Mix</h3>
    <p>Sandalwood's finest romantic numbers to sweeten your soul.</p>
  </div>
  <div class="player-container">
    <iframe id="spotify-player"
      src="https://open.spotify.com/embed/playlist/PLACEHOLDER1"
      frameborder="0"
      allowtransparency="true"
      allow="encrypted-media">
    </iframe>
  </div>

  <div class="floating-notes" id="float-container"></div>

  <script>
    const playlists = {
      romantic1: {
        id: "1e0UsAiG6FoTmkMvV7TF14?si=18LrgZj6Siis_ysbZy9s-Q",
        title: "💖 Romantic Mix",
        description: "Sandalwood's finest romantic numbers to sweeten your soul."
      },
      romantic2: {
        id: "0ClDPAJ8jtMQlqnTPSTgLp?si=FYGCVIkHQo-z4YbLUFi4Bg",
        title: "🌹 Love Ballads",
        description: "Soul-stirring Kannada ballads for the love-struck heart."
      },
      romantic3: {
        id: "3d1XYfF92iHxT94OONEaKn?si=PUS6FDzYSsKgvcxmwTMZkg",
        title: "💕 Heartfelt Duets",
        description: "Enchanting duets from Kannada cinema that speak of love."
      },
      romantic4: {
        id: "6utix5lfPoZkBirWlRujqa?si=1X0ZPUQCTUmq-tiGsjNtBQ",
        title: "❤️ Melodic Romance",
        description: "Soft, melodic romantic tracks to set a dreamy mood."
      }
    };
    function loadPlaylist(type) {
      const p = playlists[type];
      document.getElementById("spotify-player").src =
        `https://open.spotify.com/embed/playlist/${p.id}`;
      document.getElementById("playlist-description").innerHTML =
        `<h3>${p.title}</h3><p>${p.description}</p>`;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }
    window.addEventListener('DOMContentLoaded', () => loadPlaylist('romantic1'));

    const emojis = ['😍', '🎶', '💕', '😘'];
    const floatContainer = document.getElementById("float-container");

    function createFloatingEmoji() {
      const emoji = document.createElement("div");
      emoji.className = "float-emoji";
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * 100 + "vw";
      emoji.style.animationDuration = 4 + Math.random() * 4 + "s";
      floatContainer.appendChild(emoji);
      setTimeout(() => emoji.remove(), 8000);
    }

    setInterval(createFloatingEmoji, 500);
      event.target.classList.add('active');
    window.addEventListener('DOMContentLoaded', () => {
      loadPlaylist('romantic');
    });
  </script>
</body>
</html>
